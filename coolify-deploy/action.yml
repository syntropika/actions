name: Coolify Deploy
description: Find or create a Coolify application by slug, configure it, and deploy it
author: Syntropika

inputs:
  url:
    description: Coolify base URL, with or without /api/v1
    required: true
  deploy-token:
    description: Coolify token with deploy permission; may come from sops-token-key instead
    required: false
  read-token:
    description: Coolify token with read permission; required to wait, detect resource type, or verify an image
    required: false
  write-token:
    description: Coolify token with write permission; required to update environment variables or resource configuration
    required: false
  uuids:
    description: One or more resource UUIDs, separated by commas; exclusive with tags and application-slug
    required: false
  tags:
    description: One or more Coolify resource tags, separated by commas; exclusive with uuids and application-slug
    required: false
  application-slug:
    description: Stable Docker Image application name; exclusive with uuids and tags
    required: false
  project:
    description: Existing Coolify project name or UUID used to resolve an application slug
    required: false
  server:
    description: Existing Coolify server name or UUID used to resolve an application slug
    required: false
  environment:
    description: Existing Coolify environment name used to resolve an application slug; defaults to production
    required: false
  create-if-missing:
    description: Create the Docker Image application when the slug is absent; defaults to true
    required: false
  application-file:
    description: Optional JSON create/update/storage settings for the Docker Image application; legacy identity fields remain supported
    required: false
  resource-type:
    description: application, service, or auto for resource configuration and environment updates
    default: auto
  env-file:
    description: Path to a JSON object or array of environment variables; values are never logged
    required: false
  env-prefix:
    description: Step environment variables with this prefix are synced to Coolify after removing the prefix
    default: COOLIFY_ENV_
  required-env-keys:
    description: Comma-separated environment keys that must be present and nonempty before any Coolify request
    required: false
  sops-file:
    description: Path to a SOPS-encrypted JSON object of environment variables
    required: false
  sops-age-key:
    description: AGE private key used to decrypt sops-file; supply from a GitHub secret
    required: false
  sops-token-key:
    description: Key in the decrypted SOPS object used as fallback for Coolify API tokens, excluded from runtime variables
    default: COOLIFY_API_TOKEN
  sops-env-keys:
    description: Optional comma-separated allowlist of SOPS keys to sync; defaults to all except sops-token-key
    required: false
  prune-env-keys:
    description: Comma-separated environment keys managed by this action; missing keys are removed
    required: false
  patch-file:
    description: Path to a JSON object with application or service fields to update before deployment
    required: false
  image-name:
    description: Expected Docker Image repository, required when image-tag is set
    required: false
  image-tag:
    description: Docker Image tag or sha256 digest to select before deployment
    required: false
  force:
    description: Force a rebuild without cache
    default: 'false'
  pull-request-id:
    description: Pull request identifier for a Coolify preview deployment
    required: false
  docker-tag:
    description: Docker tag override for a Docker Image preview; requires pull-request-id
    required: false
  wait:
    description: Wait for deployment queue entries to finish; requires a read token
    default: 'true'
  timeout-seconds:
    description: Maximum time to wait for all deployments
    default: '1200'
  poll-interval-seconds:
    description: Time between deployment status checks
    default: '10'
  health-url:
    description: Optional HTTPS URL to check after the deployment finishes
    required: false
  health-status:
    description: Expected HTTP status from the health URL
    default: '200'
  health-timeout-seconds:
    description: Maximum time to wait for the health URL after deployment
    default: '360'

outputs:
  deployments:
    description: JSON array of deployments returned by Coolify
  deployment-uuids:
    description: Comma-separated deployment UUIDs returned by Coolify
  status:
    description: finished, accepted, or partially-observed

runs:
  using: node24
  main: dist/main.js

branding:
  icon: upload-cloud
  color: blue
